<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第五人格 · 监管者随机抽取器</title>
<style>
  :root {
    --bg-0: #120d0b;
    --bg-1: #1c1512;
    --card: #241b16;
    --card-edge: #3a2c22;
    --gold: #d6b36a;
    --gold-bright: #f0d69a;
    --ink: #ece2d2;
    --muted: #9c8c76;
    --crimson: #8b2f3a;
    --crimson-bright: #b54a56;
    --drawn: #6a4f2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Georgia", "Songti SC", "STSong", "SimSun", serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a1f18 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, #1d1210 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-0) 70%);
    background-attachment: fixed;
    padding: 40px 20px 60px;
    letter-spacing: .02em;
  }

  .container { max-width: 980px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 30px; }
  .kicker {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--crimson-bright);
    border: 1px solid rgba(181, 74, 86, .5);
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 700;
    color: var(--gold-bright);
    letter-spacing: .06em;
    text-shadow: 0 2px 20px rgba(214, 179, 106, .25);
  }
  .sub { margin-top: 12px; color: var(--muted); font-size: 15px; }

  .stats {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 24px 0;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    padding: 12px 22px;
    text-align: center;
    min-width: 130px;
  }
  .stat .num { font-size: 26px; color: var(--gold); font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .15em; }

  .slots {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin: 30px 0;
  }
  @media (max-width: 640px) { .slots { grid-template-columns: repeat(2, 1fr); } }

  .slot {
    position: relative;
    aspect-ratio: 3 / 4;
    perspective: 700px;
    cursor: default;
  }
  .slot-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.2, .7, .2, 1);
  }
  .slot.flipped .slot-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 1px solid var(--card-edge);
  }
  .face.front {
    background: linear-gradient(160deg, #2b201a, #1d1512);
    color: #4f4438;
  }
  .face.front .idx {
    font-size: 30px; color: #4a3f33; font-weight: 700;
  }
  .face.front .q { font-size: 20px; margin-top: 6px; opacity: .6; }
  .face.back {
    background: linear-gradient(160deg, #33241c, #221712);
    border-color: var(--gold);
    box-shadow: inset 0 0 0 1px rgba(214,179,106,.25), 0 8px 30px rgba(0,0,0,.4);
    transform: rotateY(180deg);
    padding: 12px;
  }
  .face.back .seal {
    font-size: 26px; color: var(--gold);
    margin-bottom: 8px;
  }
  .face.back .name {
    font-size: 18px; font-weight: 700; color: var(--gold-bright);
    text-align: center; line-height: 1.35;
    word-break: break-all;
  }
  .face.back .no {
    margin-top: 10px; font-size: 11px; color: var(--muted); letter-spacing: .2em;
  }

  .controls { display: flex; justify-content: center; gap: 16px; margin: 28px 0 10px; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 17px;
    letter-spacing: .15em;
    padding: 14px 34px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  button:active { transform: translateY(1px); }
  #drawBtn {
    background: linear-gradient(180deg, #a03a45, #7c2833);
    color: #fff4e6;
    border-color: #c15863;
    box-shadow: 0 8px 24px rgba(140, 47, 58, .4);
  }
  #drawBtn:hover { background: linear-gradient(180deg, #b5444f, #8b2f3a); }
  #drawBtn:disabled {
    background: #3a2f28; color: #7a6c5a; border-color: #4a3f33;
    box-shadow: none; cursor: not-allowed;
  }
  #resetBtn {
    background: transparent; color: var(--muted); border-color: var(--card-edge);
  }
  #resetBtn:hover { color: var(--ink); border-color: var(--gold); }

  .hint { text-align: center; color: var(--muted); min-height: 22px; font-size: 14px; margin: 10px 0 24px; }
  .hint.done { color: var(--gold-bright); }

  .pool { margin-top: 20px; }
  .pool h2 {
    font-size: 14px; color: var(--muted); letter-spacing: .3em;
    text-align: center; margin-bottom: 16px; font-weight: 400;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--ink);
    transition: all .3s ease;
  }
  .chip.drawn {
    background: var(--drawn);
    color: #cbbd9f;
    border-color: transparent;
    text-decoration: line-through;
    opacity: .75;
  }
  .chip.latest { border-color: var(--gold-bright); color: var(--gold-bright); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <span class="kicker">Identity V · Hunter</span>
      <h1>监管者随机抽取器</h1>
      <p class="sub">从 36 名监管者中，依次<b style="color:var(--gold)">不放回</b>抽取 <b style="color:var(--gold)">10</b> 名不同的监管者</p>
    </header>

    <div class="stats">
      <div class="stat"><div class="num" id="drawnCount">0</div><div class="label">已抽取 / 10</div></div>
      <div class="stat"><div class="num" id="poolCount">36</div><div class="label">奖池剩余 / 36</div></div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="controls">
      <button id="drawBtn">抽取下一位</button>
      <button id="resetBtn">重新开始</button>
    </div>
    <p class="hint" id="hint">点击「抽取下一位」随机抽出 1 名监管者</p>

    <section class="pool">
      <h2>—— 奖 池 ——</h2>
      <div class="chips" id="chips"></div>
    </section>
  </div>

<script>
  // ============ 奖池：36 名监管者（按上线顺序） ============
  // 如需增删角色，直接修改这个数组即可。
  const HUNTERS = [
    "厂长", "小丑", "鹿头", "杰克", "蜘蛛", "红蝶",
    "黄衣之主", "宿伞之魂", "摄影师", "疯眼", "梦之女巫", "爱哭鬼",
    "孽蜥", "红夫人", "26号守卫（邦邦）", "使徒", "小提琴家", "雕刻家",
    "博士", "破轮", "渔女", "蜡像师", "噩梦", "记录员",
    "隐士", "守夜人", "歌剧演员", "愚人金", "时空之影", "跛脚羊",
    "喧嚣", "杂货商", "台球手", "女王蜂", "牙医", "心兽"
  ];

  const DRAW_TOTAL = 10;

  let pool = [];   // 当前未被抽走的监管者
  let drawn = [];  // 已抽到的监管者（顺序）

  const slotsEl = document.getElementById('slots');
  const chipsEl = document.getElementById('chips');
  const drawBtn = document.getElementById('drawBtn');
  const resetBtn = document.getElementById('resetBtn');
  const hintEl = document.getElementById('hint');
  const drawnCountEl = document.getElementById('drawnCount');
  const poolCountEl = document.getElementById('poolCount');

  function buildSlots() {
    slotsEl.innerHTML = '';
    for (let i = 0; i < DRAW_TOTAL; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.innerHTML = `
        <div class="slot-inner">
          <div class="face front"><div class="idx">${i + 1}</div><div class="q">?</div></div>
          <div class="face back">
            <div class="seal">⚜</div>
            <div class="name"></div>
            <div class="no">第 ${i + 1} 名</div>
          </div>
        </div>`;
      slotsEl.appendChild(slot);
    }
  }

  function buildChips() {
    chipsEl.innerHTML = '';
    HUNTERS.forEach(name => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = name;
      c.dataset.name = name;
      chipsEl.appendChild(c);
    });
  }

  function render() {
    // 槽位
    Array.from(slotsEl.children).forEach((slot, i) => {
      if (i < drawn.length) {
        slot.classList.add('flipped');
        slot.querySelector('.name').textContent = drawn[i];
      } else {
        slot.classList.remove('flipped');
        slot.querySelector('.name').textContent = '';
      }
    });

    // 计数
    drawnCountEl.textContent = drawn.length;
    poolCountEl.textContent = pool.length;

    // 奖池高亮
    chipsEl.querySelectorAll('.chip').forEach(c => {
      const name = c.dataset.name;
      c.classList.toggle('drawn', drawn.includes(name));
      c.classList.toggle('latest', name === drawn[drawn.length - 1]);
    });

    // 按钮与提示
    const done = drawn.length >= DRAW_TOTAL;
    drawBtn.disabled = done || pool.length === 0;
    if (done) {
      hintEl.className = 'hint done';
      hintEl.textContent = '抽取完成！共 10 名监管者已确定。点击「重新开始」再来一轮。';
    } else {
      hintEl.className = 'hint';
      hintEl.textContent = `已抽取 ${drawn.length} / ${DRAW_TOTAL}，剩余 ${pool.length} 名可抽`;
    }
  }

  function draw() {
    if (drawn.length >= DRAW_TOTAL || pool.length === 0) return;
    const idx = Math.floor(Math.random() * pool.length);
    const hunter = pool.splice(idx, 1)[0]; // 不放回
    drawn.push(hunter);
    render();
  }

  function reset() {
    pool = HUNTERS.slice();
    drawn = [];
    render();
  }

  drawBtn.addEventListener('click', draw);
  resetBtn.addEventListener('click', reset);

  buildSlots();
  buildChips();
  reset();
</script>
</body>
</html>
